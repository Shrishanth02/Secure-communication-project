{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secure Communication — X25519 ECDH · AES-256-GCM · SHA-256</title>
  <link href="{% static 'style.css' %}" rel="stylesheet" type="text/css">
</head>
<body>

  <header class="app-header">
    <div class="header-inner">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2l7 3v6c0 4.5-3 8.3-7 9-4-.7-7-4.5-7-9V5l7-3z"/>
          <rect x="9" y="11" width="6" height="5" rx="1"/>
          <path d="M10.5 11V9.5a1.5 1.5 0 0 1 3 0V11"/>
        </svg>
      </span>
      <span class="brand-text">
        <span class="brand-title">Secure Communication</span>
        <span class="brand-sub">X25519 ECDH · AES-256-GCM · SHA-256</span>
      </span>
    </div>
  </header>

  <nav class="app-nav" aria-label="Primary">
    <ul>
      <li><a href="{% url 'UploadFile' %}">Upload</a></li>
      <li><a href="{% url 'DownloadFile' %}">Download</a></li>
      <li><a href="{% url 'FileIntegrity' %}">Integrity</a></li>
      <li><a href="{% url 'Logout' %}">Logout</a></li>
    </ul>
  </nav>

  <main class="page">
    <section class="card card--wide">
      <h1 class="card-title">Dashboard</h1>
      <p class="card-subtitle">Your secured files and session overview.</p>

      <div class="content-area">
        <div class="table-wrap">{{ data|safe }}</div>
      </div>
    </section>
  </main>

</body>
</html>
