{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secure Communication — Sign in</title>
  <link href="{% static 'style.css' %}" rel="stylesheet" type="text/css">
</head>
<body>

  <header class="topbrand">
    <div class="inner">
      <div class="brand">
        <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l7 3v6c0 4.5-3 8.3-7 9-4-.7-7-4.5-7-9V5l7-3z"/><path d="M9 12l2 2 4-4"/></svg></span>
        <span style="display:flex;flex-direction:column">
          <span class="t1">Secure Communication</span>
          <span class="t2">X25519 ECDH · AES-256-GCM · SHA-256</span>
        </span>
      </div>
      <span class="spacer"></span>
      <a class="navlink" href="{% url 'index' %}">Home</a>
      <a class="navlink" href="{% url 'UserLogin' %}">Login</a>
      <a class="navlink primary" href="{% url 'Signup' %}">Sign up</a>
    </div>
  </header>

  <div class="auth-wrap">
    <div class="auth-card panel">
      <div class="panel-pad">
        <h2>Sign in</h2>
        <p class="lead">Access your encrypted file vault.</p>

        {% if data %}
        <div class="flash error"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg><div>{{ data }}</div></div>
        {% endif %}

        <form name="f1" method="post" action="{% url 'UserLoginAction' %}">
          {% csrf_token %}
          <div class="form-grid">
            <div class="field">
              <label for="t1">Username</label>
              <input id="t1" name="t1" type="text" autocomplete="username" required>
            </div>
            <div class="field">
              <label for="t2">Password</label>
              <input id="t2" name="t2" type="password" autocomplete="current-password" required>
            </div>
          </div>
          <div class="form-actions"><button type="submit" class="btn btn-primary btn-block">Login</button></div>
          <div class="form-sub">New here? <a href="{% url 'Signup' %}">Create an account</a></div>
        </form>
      </div>
    </div>
  </div>

</body>
</html>
